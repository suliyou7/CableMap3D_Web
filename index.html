<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Global Submarine Cable Map | 3D Visualizer</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Carga única y limpia del bundle oficial de Globe.gl (incluye Three.js optimizado) -->
    <script src="https://unpkg.com/globe.gl"></script>
    <style>
        body { margin: 0; background-color: #030712; color: #f3f4f6; font-family: ui-sans-serif, system-ui, sans-serif; overflow: hidden; }
        #globe-container { width: 100vw; height: 100vh; position: absolute; top: 0; left: 0; z-index: 1; }
        .glass-panel {
            background: rgba(15, 23, 42, 0.85);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(51, 65, 85, 0.5);
        }
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: rgba(15, 23, 42, 0.5); }
        ::-webkit-scrollbar-thumb { background: #334155; border-radius: 3px; }
    </style>
</head>
<body class="bg-gray-950 text-gray-100">

    <!-- Contenedor del Globo 3D -->
    <div id="globe-container"></div>

    <!-- Interfaz de Usuario (UI) -->
    <div class="relative z-10 p-6 pointer-events-none flex flex-col justify-between h-screen max-w-lg">
        
        <!-- Cabecera y Buscador -->
        <div class="glass-panel p-5 rounded-xl shadow-2xl pointer-events-auto space-y-4">
            <div>
                <div class="flex items-center space-x-2">
                    <span class="h-3 w-3 bg-cyan-400 rounded-full animate-pulse"></span>
                    <h1 class="text-xl font-bold tracking-wider text-cyan-400 uppercase">Submarine Cable 3D</h1>
                </div>
                <p class="text-xs text-gray-400 mt-1">Infraestructura global de internet y telecomunicaciones submarinas.</p>
            </div>

            <!-- Buscador -->
            <div class="relative">
                <input type="text" id="search-input" placeholder="Buscar cable (ej. MAREA, Curie, 2Africa)..." 
                    class="w-full bg-gray-900 border border-gray-700 rounded-lg px-4 py-2 text-sm text-white placeholder-gray-500 focus:outline-none focus:border-cyan-500 transition-colors">
            </div>

            <!-- Filtros rápidos -->
            <div class="flex flex-wrap gap-2 pt-1">
                <button onclick="filterCables('all', event)" class="filter-btn text-xs bg-cyan-950 text-cyan-300 border border-cyan-800 px-3 py-1 rounded-md transition hover:bg-cyan-900">Todos</button>
                <button onclick="filterCables('Transatlantic', event)" class="filter-btn text-xs bg-gray-900 text-gray-300 border border-gray-700 px-3 py-1 rounded-md transition hover:bg-gray-800">Transatlánticos</button>
                <button onclick="filterCables('Transpacific', event)" class="filter-btn text-xs bg-gray-900 text-gray-300 border border-gray-700 px-3 py-1 rounded-md transition hover:bg-gray-800">Transpacíficos</button>
                <button onclick="filterCables('Africa', event)" class="filter-btn text-xs bg-gray-900 text-gray-300 border border-gray-700 px-3 py-1 rounded-md transition hover:bg-gray-800">África / Europa</button>
            </div>
        </div>

        <!-- Panel de Detalles del Cable Seleccionado -->
        <div id="detail-panel" class="glass-panel p-5 rounded-xl shadow-2xl pointer-events-auto transform transition-all duration-300 translate-y-96 opacity-0 absolute bottom-6 left-6 right-6 max-w-md">
            <div class="flex justify-between items-start">
                <div>
                    <span id="cable-region" class="text-xs uppercase tracking-widest text-cyan-400 font-semibold"></span>
                    <h2 id="cable-name" class="text-2xl font-bold text-white mt-0.5"></h2>
                </div>
                <button onclick="closeDetails()" class="text-gray-400 hover:text-white text-lg font-bold px-2">&times;</button>
            </div>
            
            <div class="grid grid-cols-2 gap-4 mt-4 text-sm border-t border-gray-800 pt-3">
                <div>
                    <span class="text-gray-400 block text-xs">Propietarios / Consorcio</span>
                    <span id="cable-owners" class="font-medium text-gray-200"></span>
                </div>
                <div>
                    <span class="text-gray-400 block text-xs">Año RFS (Servicio)</span>
                    <span id="cable-rfs" class="font-medium text-gray-200"></span>
                </div>
                <div>
                    <span class="text-gray-400 block text-xs">Longitud Estimada</span>
                    <span id="cable-length" class="font-medium text-gray-200"></span>
                </div>
                <div>
                    <span class="text-gray-400 block text-xs">Puntos de Aterrizaje</span>
                    <span id="cable-landings" class="font-medium text-gray-200"></span>
                </div>
            </div>
        </div>

    </div>

    <!-- Script Principal de Lógica y Datos -->
    <script>
        const submarineCables = [
            {
                name: "MAREA",
                region: "Transatlántico",
                owners: "Microsoft, Meta, Telxius",
                rfs: "2017",
                length: "6,600 km",
                landings: "Virginia Beach (EEUU) - Sopelana (España)",
                color: "#06b6d4",
                coords: [
                    [36.8529, -75.9780],
                    [39.0, -40.0],
                    [43.3833, -2.9833]
                ]
            },
            {
                name: "Curie",
                region: "Transpacífico",
                owners: "Google",
                rfs: "2019",
                length: "10,500 km",
                landings: "Los Ángeles (EEUU) - Valparaíso (Chile)",
                color: "#3b82f6",
                coords: [
                    [33.7420, -118.25],
                    [10.0, -110.0],
                    [-15.0, -90.0],
                    [-33.0472, -71.6127]
                ]
            },
            {
                name: "2Africa",
                region: "África / Europa / Medio Oriente",
                owners: "Meta, Vodafone, Orange, MTN, Telecom Egypt",
                rfs: "2024 (En despliegue)",
                length: "45,000 km",
                landings: "Circunda África, Europa y Medio Oriente",
                color: "#10b981",
                coords: [
                    [51.5074, -0.1278],
                    [36.7538, 3.0588],
                    [31.2001, 29.9187],
                    [-1.2921, 36.8219],
                    [-25.9692, 32.5732],
                    [30.0444, 31.2357]
                ]
            },
            {
                name: "EllaLink",
                region: "Transatlántico Sur",
                owners: "EllaLink, Telebras",
                rfs: "2021",
                length: "6,000 km",
                landings: "Sines (Portugal) - Fortaleza (Brasil)",
                color: "#8b5cf6",
                coords: [
                    [37.9556, -8.8639],
                    [15.0, -30.0],
                    [-3.7172, -38.5433]
                ]
            },
            {
                name: "Dunant",
                region: "Transatlántico Norte",
                owners: "Google",
                rfs: "2020",
                length: "6,600 km",
                landings: "Virginia Beach (EEUU) - Saint-Hilaire-de-Riez (Francia)",
                color: "#ec4899",
                coords: [
                    [36.8529, -75.9780],
                    [42.0, -35.0],
                    [46.7667, -1.9500]
                ]
            },
            {
                name: "Monet",
                region: "América / Transatlántico",
                owners: "Google, Algar Telecom, Angola Cables, ANTEL",
                rfs: "2017",
                length: "10,556 km",
                landings: "Boca Raton (EEUU) - Fortaleza y Santos (Brasil)",
                color: "#f59e0b",
                coords: [
                    [26.3683, -80.0898],
                    [5.0, -45.0],
                    [-3.7172, -38.5433],
                    [-23.9618, -46.3322]
                ]
            }
        ];

        let world;

        function initGlobe() {
            const container = document.getElementById('globe-container');
            
            world = Globe()(container)
                .globeImageUrl('//unpkg.com/three-globe/example/img/earth-night.jpg')
                .bumpImageUrl('//unpkg.com/three-globe/example/img/earth-topology.png')
                .backgroundImageUrl('//unpkg.com/three-globe/example/img/night-sky.png')
                // 1. Cargamos los datos
                .pathsData(submarineCables)
                // 2. ¡LÍNEA CLAVE! Le decimos que las rutas están en la propiedad 'coords'
                .pathPoints(d => d.coords) 
                .pathColor(d => d.color)
                .pathDashLength(0.01)
                .pathDashGap(0.004)
                .pathDashAnimateSpeed(12)
                .pathStroke(2)
                // 3. Le decimos que dentro de cada 'coord', [0] es latitud y [1] es longitud
                .pathPointLat(p => p[0])
                .pathPointLng(p => p[1])
                .pathLabel(d => `<div style="background: rgba(0,0,0,0.85); padding: 6px 10px; border-radius: 6px; font-size: 12px; border: 1px solid #334155; color: #fff;"><b>${d.name}</b> (${d.region})</div>`)
                .onPathClick(d => selectCable(d));

            world.controls().autoRotate = true;
            world.controls().autoRotateSpeed = 0.3;
            world.controls().enableZoom = true;
        }

        function updateGlobePaths(data) {
            world.pathsData(data);
        }

        function selectCable(cable) {
            const panel = document.getElementById('detail-panel');
            document.getElementById('cable-name').innerText = cable.name;
            document.getElementById('cable-region').innerText = cable.region;
            document.getElementById('cable-owners').innerText = cable.owners;
            document.getElementById('cable-rfs').innerText = cable.rfs;
            document.getElementById('cable-length').innerText = cable.length;
            document.getElementById('cable-landings').innerText = cable.landings;

            panel.classList.remove('translate-y-96', 'opacity-0');

            if (cable.coords && cable.coords.length > 0) {
                const midPoint = cable.coords[Math.floor(cable.coords.length / 2)];
                world.pointOfView({ lat: midPoint[0], lng: midPoint[1], altitude: 1.5 }, 1200);
            }
        }

        function closeDetails() {
            const panel = document.getElementById('detail-panel');
            panel.classList.add('translate-y-96', 'opacity-0');
        }

        function filterCables(category, event) {
            document.querySelectorAll('.filter-btn').forEach(btn => {
                btn.classList.remove('bg-cyan-950', 'text-cyan-300', 'border-cyan-800');
                btn.classList.add('bg-gray-900', 'text-gray-300', 'border-gray-700');
            });
            event.target.classList.remove('bg-gray-900', 'text-gray-300', 'border-gray-700');
            event.target.classList.add('bg-cyan-950', 'text-cyan-300', 'border-cyan-800');

            if (category === 'all') {
                updateGlobePaths(submarineCables);
            } else {
                const filtered = submarineCables.filter(c => c.region.includes(category));
                updateGlobePaths(filtered);
            }
        }

        document.getElementById('search-input').addEventListener('input', (e) => {
            const query = e.target.value.toLowerCase();
            const filtered = submarineCables.filter(c => 
                c.name.toLowerCase().includes(query) || 
                c.owners.toLowerCase().includes(query) ||
                c.landings.toLowerCase().includes(query)
            );
            updateGlobePaths(filtered);
        });

        window.onload = initGlobe;
    </script>
</body>
</html>
