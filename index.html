<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Global Submarine Cable Map | 3D Visualizer</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Globe.gl & Three.js -->
    <script src="https://unpkg.com/globe.gl"></script>
    <style>
        body { 
            margin: 0; 
            background-color: #000; 
            color: #fff; 
            font-family: ui-sans-serif, system-ui, sans-serif, "Apple Color Emoji", "Segoe UI Emoji", "Segoe UI Symbol", "Noto Color Emoji"; 
            overflow: hidden; 
        }
        #globe-container { 
            width: 100vw; 
            height: 100vh; 
            position: absolute; 
            top: 0; 
            left: 0; 
            z-index: 1; 
        }
        .ui-layer { 
            position: relative; 
            z-index: 10; 
            pointer-events: none; 
        }
        .pointer-auto { 
            pointer-events: auto; 
        }
        .glass-panel {
            background: rgba(15, 23, 42, 0.85);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(51, 65, 85, 0.5);
        }
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: rgba(15, 23, 42, 0.5); }
        ::-webkit-scrollbar-thumb { background: #334155; border-radius: 3px; }
    </style>
</head>
<body class="bg-gray-950 text-white">

    <!-- Contenedor del Globo 3D -->
    <div id="globe-container"></div>

    <!-- Interfaz de Usuario (UI) -->
    <div class="ui-layer p-6 flex flex-col justify-between h-screen max-w-md">
        
        <!-- Panel Superior / Buscador -->
        <div class="glass-panel p-5 rounded-xl shadow-2xl pointer-auto space-y-4">
            <div>
                <div class="flex items-center space-x-2">
                    <span class="h-3 w-3 bg-cyan-400 rounded-full animate-pulse"></span>
                    <h1 class="text-xl font-bold tracking-wider text-cyan-400 uppercase">Submarine Cable 3D</h1>
                </div>
                <p class="text-xs text-gray-400 mt-1">Infraestructura global de internet y telecomunicaciones submarinas.</p>
            </div>

            <!-- Campo de búsqueda -->
            <div class="relative">
                <input type="text" id="search-input" placeholder="Buscar cable por nombre..." 
                    class="w-full bg-gray-950 border border-gray-700 rounded-lg px-4 py-2 text-sm text-white placeholder-gray-500 focus:outline-none focus:border-cyan-500 transition-colors">
            </div>
        </div>

        <!-- Panel Inferior de Detalles del Cable -->
        <div id="info-panel" class="glass-panel p-5 rounded-xl shadow-2xl pointer-auto transform translate-y-96 opacity-0 transition-all duration-300">
            <div class="flex justify-between items-start">
                <div>
                    <span id="cable-region" class="text-xs uppercase tracking-widest text-cyan-400 font-semibold">INFRAESTRUCTURA</span>
                    <h2 id="cable-title" class="text-2xl font-bold text-white mt-0.5"></h2>
                </div>
                <button onclick="closeDetails()" class="text-gray-400 hover:text-white text-lg font-bold px-2">&times;</button>
            </div>
            
            <div class="grid grid-cols-2 gap-4 mt-4 text-sm border-t border-gray-800 pt-3">
                <div>
                    <span class="text-gray-400 block text-xs">Estado de Red</span>
                    <span id="cable-status" class="font-medium text-green-400">🟢 Operativo</span>
                </div>
                <div>
                    <span class="text-gray-400 block text-xs">Longitud Estimada</span>
                    <span id="cable-length" class="font-medium text-gray-200">Desconocida</span>
                </div>
            </div>
        </div>
    </div>

    <script>
        let world;
        let cablesData = [];

        async function init() {
            const container = document.getElementById('globe-container');
            
            // Inicializar el motor Globe.gl con la configuración visual base
            world = Globe()(container)
                .globeImageUrl('https://unpkg.com/three-globe/example/img/earth-dark.jpg')
                .backgroundColor('#030712')
                .showAtmosphere(true)
                .atmosphereColor('#06b6d4')
                .atmosphereAltitude(0.15)
                .pathPoints('coords')
                .pathPointLat(p => p[1])
                .pathPointLng(p => p[0])
                .pathColor(d => d.color || '#06b6d4')
                .pathDashLength(0.05)
                .pathDashGap(0.02)
                .pathDashAnimateTime(12000)
                .onPathClick(d => showDetails(d));

            // Carga y procesamiento del archivo GeoJSON local
            try {
                const response = await fetch('cable-geo.json');
                if (!response.ok) {
                    throw new Error(`Error HTTP: ${response.status} al intentar cargar el archivo JSON.`);
                }
                
                const data = await response.json();
                let processedData = [];

                if (data && data.features) {
                    data.features.forEach(feature => {
                        const props = feature.properties || {};
                        const baseProps = {
                            name: props.name || 'Cable Submarino Desconocido',
                            color: props.color || '#06b6d4',
                            length: props.length ? `${props.length} km` : 'No especificada'
                        };

                        // Manejo seguro tanto de LineString como MultiLineString para evitar pérdidas de geometría
                        if (feature.geometry) {
                            if (feature.geometry.type === 'LineString' && feature.geometry.coordinates) {
                                processedData.push({ 
                                    ...baseProps, 
                                    coords: feature.geometry.coordinates 
                                });
                            } else if (feature.geometry.type === 'MultiLineString' && feature.geometry.coordinates) {
                                feature.geometry.coordinates.forEach(segment => {
                                    processedData.push({ 
                                        ...baseProps, 
                                        coords: segment 
                                    });
                                });
                            }
                        }
                    });
                }

                cablesData = processedData;
                world.pathsData(cablesData);
                console.log(`¡Éxito! Se han renderizado ${cablesData.length} segmentos de cables en el globo.`);

            } catch (error) {
                console.error("❌ Error crítico procesando los datos de cables:", error);
            }
        }

        // Función para mostrar el panel inferior al hacer clic en un cable
        function showDetails(cable) {
            const panel = document.getElementById('info-panel');
            document.getElementById('cable-title').innerText = cable.name;
            document.getElementById('cable-length').innerText = cable.length;
            
            // Mostrar el panel animándolo hacia arriba
            panel.classList.remove('translate-y-96', 'opacity-0');
        }

        // Función para ocultar el panel de detalles
        function closeDetails() {
            const panel = document.getElementById('info-panel');
            panel.classList.add('translate-y-96', 'opacity-0');
        }

        // Sistema de filtrado en tiempo real desde el buscador
        document.getElementById('search-input').addEventListener('input', (e) => {
            const query = e.target.value.toLowerCase().trim();
            if (!query) {
                world.pathsData(cablesData);
                return;
            }
            const filtered = cablesData.filter(c => c.name.toLowerCase().includes(query));
            world.pathsData(filtered);
        });

        // Lanzar la aplicación al cargar la ventana
        window.onload = init;
    </script>
</body>
</html>
