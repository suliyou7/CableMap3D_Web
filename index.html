<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Test Diagnóstico Globe.gl</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/globe.gl"></script>
    <style>body { margin: 0; background: #000; overflow: hidden; }</style>
</head>
<body>
    <div id="globe-container" style="width: 100vw; height: 100vh;"></div>
    <script>
        // Si este globo muestra una línea roja entre Madrid y Nueva York, 
        // significa que la librería funciona y el problema real es que tu navegador 
        // bloquea el 'fetch' de 'cable-geo.json' por seguridad CORS (al abrir el HTML directamente con doble clic).
        const world = Globe()(document.getElementById('globe-container'))
            .globeImageUrl('https://unpkg.com/three-globe/example/img/earth-dark.jpg')
            .pathsData([{
                name: "Cable de Prueba",
                color: "#ff0000",
                coords: [[-3.7038, 40.4168], [-74.0060, 40.7128]] // Madrid a NY
            }])
            .pathPoints('coords')
            .pathPointLat(p => p[1])
            .pathPointLng(p => p[0])
            .pathColor(d => d.color)
            .pathDashLength(0.05);
    </script>
</body>
</html>
