<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Global Submarine Cable Map | 3D Visualizer & Traffic</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Globe.gl & Three.js CDN -->
    <script src="https://unpkg.com/three@0.160.0/build/three.min.js"></script>
    <script src="https://unpkg.com/globe.gl"></script>
    <style>
        body { margin: 0; background-color: #030712; color: #f3f4f6; font-family: ui-sans-serif, system-ui, sans-serif; overflow: hidden; }
        #globe-container { 
            width: 100vw; 
            height: 100vh; 
            position: absolute; 
            top: 0; 
            left: 0; 
            z-index: 1; 
            touch-action: none;
        }
        .glass-panel {
            background: rgba(15, 23, 42, 0.85);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(51, 65, 85, 0.5);
        }
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: rgba(15, 23, 42, 0.5); }
        ::-webkit-scrollbar-thumb { background: #334155; border-radius: 3px; }
    </style>
</head>
<body class="bg-gray-950 text-gray-100">

    <!-- Contenedor del Globo 3D -->
    <div id="globe-container"></div>

    <!-- Interfaz de Usuario (UI) -->
    <div class="relative z-10 p-6 pointer-events-none flex flex-col justify-between h-screen max-w-lg">
        
        <!-- Cabecera y Buscador -->
        <div class="glass-panel p-5 rounded-xl shadow-2xl pointer-events-auto space-y-4">
            <div>
                <div class="flex items-center justify-between">
                    <div class="flex items-center space-x-2">
                        <span class="h-3 w-3 bg-cyan-400 rounded-full animate-pulse"></span>
                        <h1 class="text-xl font-bold tracking-wider text-cyan-400 uppercase">Submarine Cable 3D</h1>
                    </div>
                    <span id="api-status" class="text-[10px] bg-amber-950 text-amber-400 border border-amber-800 px-2 py-0.5 rounded-full">Iniciando...</span>
                </div>
                <p class="text-xs text-gray-400 mt-1">Monitoreo de tráfico en tiempo real e incidencias globales.</p>
            </div>

            <!-- Buscador -->
            <div class="relative z-20 pointer-events-auto">
                <input type="text" id="search-input" placeholder="Buscar cable (ej. MAREA, Curie, 2Africa)..." 
                    class="w-full bg-gray-900 border border-gray-700 rounded-lg px-4 py-2 text-sm text-white placeholder-gray-500 focus:outline-none focus:border-cyan-500 transition-colors pointer-events-auto">
            </div>

            <!-- Filtros rápidos -->
            <div class="flex flex-wrap gap-2 pt-1">
                <button onclick="filterCables('all', event)" class="filter-btn text-xs bg-cyan-950 text-cyan-300 border border-cyan-800 px-3 py-1 rounded-md transition hover:bg-cyan-900">Todos</button>
                <button onclick="filterCables('Atlantic', event)" class="filter-btn text-xs bg-gray-900 text-gray-300 border border-gray-700 px-3 py-1 rounded-md transition hover:bg-gray-800">Transatlánticos</button>
                <button onclick="filterCables('Pacific', event)" class="filter-btn text-xs bg-gray-900 text-gray-300 border border-gray-700 px-3 py-1 rounded-md transition hover:bg-gray-800">Transpacíficos</button>
                <button onclick="filterIncidents(event)" class="filter-btn text-xs bg-red-950 text-red-300 border border-red-800 px-3 py-1 rounded-md transition hover:bg-red-900">Ver Averías</button>
            </div>
        </div>

        <!-- Panel de Detalles del Cable Seleccionado -->
        <div id="detail-panel" class="glass-panel p-5 rounded-xl shadow-2xl pointer-events-auto transform transition-all duration-300 translate-y-96 opacity-0 absolute bottom-6 left-6 right-6 max-w-md">
            <div class="flex justify-between items-start">
                <div>
                    <span id="cable-region" class="text-xs uppercase tracking-widest text-cyan-400 font-semibold"></span>
                    <h2 id="cable-name" class="text-2xl font-bold text-white mt-0.5"></h2>
                </div>
                <button onclick="closeDetails()" class="text-gray-400 hover:text-white text-lg font-bold px-2">&times;</button>
            </div>
            
            <div id="incident-alert" class="hidden mt-3 bg-red-950/50 border border-red-800 text-red-300 p-3 rounded-lg text-sm">
                <div class="flex items-center space-x-2 font-bold mb-1">
                    <span class="h-2 w-2 bg-red-500 rounded-full animate-pulse"></span>
                    <span>ALERTA DE INCIDENCIA ACTIVA</span>
                </div>
                <p id="cable-incident-details" class="text-xs"></p>
            </div>

            <div class="grid grid-cols-2 gap-4 mt-4 text-sm border-t border-gray-800 pt-3">
                <div>
                    <span class="text-gray-400 block text-xs">Estado de Red</span>
                    <span id="cable-status" class="font-medium text-gray-200"></span>
                </div>
                <div>
                    <span class="text-gray-400 block text-xs">Tráfico Actual</span>
                    <span id="cable-traffic" class="font-medium text-cyan-400 animate-pulse"></span>
                </div>
                <div>
                    <span class="text-gray-400 block text-xs">Longitud Estimada</span>
                    <span id="cable-length" class="font-medium text-gray-200"></span>
                </div>
                <div>
                    <span class="text-gray-400 block text-xs">Consorcio / Propietario</span>
                    <span id="cable-owners" class="font-medium text-gray-200 truncate block"></span>
                </div>
            </div>
        </div>
    </div>

    <script>
        let world;
        let globalCablesData = []; 
        let trafficPhotons = [];

        // Generar una textura programática para los impulsos fotónicos
        function createPhotonTexture() {
            const canvas = document.createElement('canvas');
            canvas.width = 128;
            canvas.height = 128;
            const ctx = canvas.getContext('2d');

            const gradient = ctx.createRadialGradient(64, 64, 0, 64, 64, 64);
            gradient.addColorStop(0, 'rgba(255, 255, 255, 1)');
            gradient.addColorStop(0.2, 'rgba(56, 189, 248, 0.9)');
            gradient.addColorStop(0.5, 'rgba(6, 182, 212, 0.4)');
            gradient.addColorStop(1, 'rgba(0, 0, 0, 0)');

            ctx.fillStyle = gradient;
            ctx.fillRect(0, 0, 128, 128);

            return new THREE.CanvasTexture(canvas);
        }

        const photonTexture = createPhotonTexture();

        // Datos de muestra en caso de abrir en local sin servidor de archivos
        const fallbackGeoJSON = {
            "type": "FeatureCollection",
            "features": [
                {
                    "type": "Feature",
                    "properties": { "id": "MAREA", "name": "MAREA (EE.UU. - España)", "length": "6600", "owners": "Microsoft, Meta, Telxius", "color": "#06b6d4" },
                    "geometry": { "type": "LineString", "coordinates": [[-75.96, 36.85], [-30.0, 40.0], [-8.0, 43.5]] }
                },
                {
                    "type": "Feature",
                    "properties": { "id": "CURIE", "name": "Curie (EE.UU. - Chile)", "length": "10500", "owners": "Google", "color": "#38bdf8" },
                    "geometry": { "type": "LineString", "coordinates": [[-118.24, 34.05], [-105.0, 10.0], [-70.4, -23.6]] }
                },
                {
                    "type": "Feature",
                    "properties": { "id": "2AFRICA", "name": "2Africa (Circunvalación África)", "length": "45000", "owners": "Meta, Vodafone, Orange", "color": "#10b981" },
                    "geometry": { "type": "LineString", "coordinates": [[-0.12, 51.5], [-9.14, 38.7], [-17.4, 14.7], [18.4, -33.9], [39.2, -4.0], [32.5, 29.9]] }
                },
                {
                    "type": "Feature",
                    "properties": { "id": "FASTER", "name": "FASTER (EE.UU. - Japón)", "length": "9000", "owners": "Google, China Mobile", "color": "#8b5cf6" },
                    "geometry": { "type": "LineString", "coordinates": [[-123.9, 45.1], [180.0, 40.0], [139.7, 35.6]] }
                }
            ]
        };

        function initGlobe() {
            const container = document.getElementById('globe-container');
            
            world = Globe()(container)
                .globeImageUrl('https://unpkg.com/three-globe/example/img/earth-night.jpg')
                .bumpImageUrl('https://unpkg.com/three-globe/example/img/earth-topology.png')
                
                .atmosphereColor('#0ea5e9')
                .atmosphereAltitude(0.18)
                
                // Cables base sólidos
                .pathPoints(d => d.coords) 
                .pathColor(d => d.status === 'fault' ? '#ef4444' : (d.color || '#06b6d4'))
                .pathStroke(1.5)
                .pathPointLat(p => p[1])
                .pathPointLng(p => p[0])

                // Anillos pulsantes
                .ringsData([])
                .ringColor(d => d.color)
                .ringMaxRadius(d => d.maxRadius)
                .ringPropagationSpeed(d => d.speed)
                .ringRepeatPeriod(d => d.period)

                // Capa de fotones de luz alta definición
                .customLayerData([])
                .customThreeObject(d => {
                    const material = new THREE.SpriteMaterial({ 
                        map: photonTexture, 
                        color: d.color,
                        transparent: true,
                        blending: THREE.AdditiveBlending,
                        depthWrite: false
                    });
                    const sprite = new THREE.Sprite(material);
                    sprite.scale.set(d.size, d.size, 1.0);
                    return sprite;
                })
                .customThreeObjectUpdate((obj, d) => {
                    const coord = world.getCoords(d.lat, d.lng, d.alt);
                    if (coord) {
                        obj.position.set(coord.x, coord.y, coord.z);
                    }
                })
                .pathLabel(d => `
                    <div style="background: rgba(15,23,42,0.95); padding: 8px; border-radius: 6px; font-size: 12px; border: 1px solid ${d.status === 'fault' ? '#ef4444' : '#334155'}; color: #fff;">
                        <b style="color: ${d.status === 'fault' ? '#f87171' : '#38bdf8'}">${d.name}</b><br>
                        ${d.status === 'fault' ? '⚠️ Avería reportada' : '⚡ Tráfico Activo (' + d.trafficLoad + ')'}
                    </div>
                `)
                .onPathClick(d => {
                    world.controls().autoRotate = false;
                    selectCable(d);
                });

            world.renderer().setPixelRatio(Math.min(window.devicePixelRatio, 2));

            const controls = world.controls();
            controls.autoRotate = true;
            controls.autoRotateSpeed = 0.4;
            controls.enableZoom = true;
            controls.enablePan = true;

            controls.addEventListener('start', () => {
                controls.autoRotate = false;
            });

            loadCableDataAndIncidents();
            animateTrafficPhotons();
        }

        async function loadCableDataAndIncidents() {
            let geojson;
            try {
                const geoResponse = await fetch('./cable-geo.json');
                if (!geoResponse.ok) throw new Error("Carga local restrinjida por navegador");
                geojson = await geoResponse.json();
                document.getElementById('api-status').innerText = 'GeoJSON Cargado';
                document.getElementById('api-status').className = 'text-[10px] bg-emerald-950 text-emerald-400 border border-emerald-800 px-2 py-0.5 rounded-full';
            } catch (error) {
                console.warn("Utilizando datos GeoJSON incrustados debido a restricciones de fetch local:", error);
                geojson = fallbackGeoJSON;
                document.getElementById('api-status').innerText = 'Modo Respaldo Activo';
                document.getElementById('api-status').className = 'text-[10px] bg-cyan-950 text-cyan-400 border border-cyan-800 px-2 py-0.5 rounded-full';
            }

            let processedData = [];
            const len = geojson.features.length;
            for (let i = 0; i < len; i++) {
                const feature = geojson.features[i];
                const props = feature.properties;
                const isFaulty = Math.random() < 0.05;

                const baseCable = {
                    id: props.id || 'cable-' + i,
                    name: props.name || 'Cable Submarino',
                    color: props.color || '#06b6d4',
                    length: props.length ? `${props.length} km` : 'No especificada',
                    owners: props.owners || props.suppliers || 'Consorcio internacional',
                    trafficLoad: (85 + (i % 40)) + " Gbps",
                    status: isFaulty ? 'fault' : 'active',
                    incident_details: isFaulty ? "Anomalía de latencia y caída de paquetes reportada por estaciones de amarre." : null
                };

                if (feature.geometry.type === 'LineString') {
                    processedData.push({ ...baseCable, coords: feature.geometry.coordinates });
                } else if (feature.geometry.type === 'MultiLineString') {
                    const segments = feature.geometry.coordinates;
                    for (let j = 0; j < segments.length; j++) {
                        processedData.push({ ...baseCable, coords: segments[j] });
                    }
                }
            }

            globalCablesData = processedData; 
            world.pathsData(globalCablesData);
            generatePhotonsForCables(globalCablesData);
        }

        function generatePhotonsForCables(cables) {
            trafficPhotons = [];

            cables.forEach((cable) => {
                if (!cable.coords || cable.coords.length < 2) return;
                
                const count = cable.status === 'fault' ? 1 : 4;
                for (let i = 0; i < count; i++) {
                    trafficPhotons.push({
                        coords: cable.coords,
                        progress: (i / count) + (Math.random() * 0.1),
                        speed: (0.002 + Math.random() * 0.002) * (cable.status === 'fault' ? 0.2 : 1.2),
                        size: cable.status === 'fault' ? 1.4 : 0.9,
                        color: cable.status === 'fault' ? '#ef4444' : (Math.random() > 0.5 ? '#38bdf8' : '#ffffff'),
                        lat: cable.coords[0][1],
                        lng: cable.coords[0][0],
                        alt: 0.003
                    });
                }
            });

            world.customLayerData(trafficPhotons);
        }

        function animateTrafficPhotons() {
            if (trafficPhotons.length > 0) {
                trafficPhotons.forEach(p => {
                    p.progress += p.speed;
                    if (p.progress >= 1) p.progress = 0;

                    const totalSegments = p.coords.length - 1;
                    const currentPoint = p.progress * totalSegments;
                    const index = Math.floor(currentPoint);
                    const t = currentPoint - index;

                    const nextIndex = Math.min(index + 1, totalSegments);

                    const lng1 = p.coords[index][0];
                    const lat1 = p.coords[index][1];
                    const lng2 = p.coords[nextIndex][0];
                    const lat2 = p.coords[nextIndex][1];

                    p.lng = lng1 + (lng2 - lng1) * t;
                    p.lat = lat1 + (lat2 - lat1) * t;
                });

                world.customLayerData(trafficPhotons);
            }
            requestAnimationFrame(animateTrafficPhotons);
        }

        function selectCable(cable) {
            const panel = document.getElementById('detail-panel');
            const alertBox = document.getElementById('incident-alert');
            
            document.getElementById('cable-name').innerText = cable.name;
            document.getElementById('cable-region').innerText = 'ID: ' + cable.id;
            document.getElementById('cable-owners').innerText = cable.owners;
            document.getElementById('cable-traffic').innerText = cable.trafficLoad;
            document.getElementById('cable-length').innerText = cable.length;
            
            const statusEl = document.getElementById('cable-status');
            if (cable.status === 'fault') {
                statusEl.innerHTML = '<span class="text-red-500 font-bold">Caído / Avería</span>';
                alertBox.classList.remove('hidden');
                document.getElementById('cable-incident-details').innerText = cable.incident_details;
            } else {
                statusEl.innerHTML = '<span class="text-emerald-400 font-bold">Óptimo / Estable</span>';
                alertBox.classList.add('hidden');
            }

            if (cable.coords && cable.coords.length >= 2) {
                const startPt = cable.coords[0];
                const endPt = cable.coords[cable.coords.length - 1];
                const ringColor = cable.status === 'fault' ? '#ef4444' : '#06b6d4';

                const selectedRings = [
                    { lat: startPt[1], lng: startPt[0], color: ringColor, maxRadius: 3, speed: 3, period: 1200 },
                    { lat: endPt[1], lng: endPt[0], color: ringColor, maxRadius: 3, speed: 3, period: 1200 }
                ];
                world.ringsData(selectedRings);
            }

            panel.classList.remove('translate-y-96', 'opacity-0');

            if (cable.coords && cable.coords.length > 0) {
                const midPoint = cable.coords[Math.floor(cable.coords.length / 2)];
                world.pointOfView({ lat: midPoint[1], lng: midPoint[0], altitude: 1.2 }, 1200);
            }
        }

        function closeDetails() {
            document.getElementById('detail-panel').classList.add('translate-y-96', 'opacity-0');
            world.ringsData([]);
        }

        function filterCables(category, event) {
            updateFilterButtons(event.target);
            world.ringsData([]);
            let filtered = globalCablesData;
            if (category !== 'all') {
                filtered = globalCablesData.filter(c => 
                    c.name.toLowerCase().includes(category.toLowerCase()) || 
                    (c.id && c.id.toLowerCase().includes(category.toLowerCase()))
                );
                if (filtered.length === 0) filtered = globalCablesData;
            }
            world.pathsData(filtered);
            generatePhotonsForCables(filtered);
        }

        function filterIncidents(event) {
            updateFilterButtons(event.target);
            world.ringsData([]);
            const faults = globalCablesData.filter(c => c.status === 'fault');
            world.pathsData(faults);
            generatePhotonsForCables(faults);
        }

        function updateFilterButtons(activeButton) {
            document.querySelectorAll('.filter-btn').forEach(btn => {
                btn.classList.remove('bg-cyan-950', 'text-cyan-300', 'border-cyan-800', 'bg-red-950', 'text-red-300', 'border-red-800');
                btn.classList.add('bg-gray-900', 'text-gray-300', 'border-gray-700');
            });
            activeButton.classList.remove('bg-gray-900', 'text-gray-300', 'border-gray-700');
            if (activeButton.innerText.includes('Averías')) {
                activeButton.classList.add('bg-red-950', 'text-red-300', 'border-red-800');
            } else {
                activeButton.classList.add('bg-cyan-950', 'text-cyan-300', 'border-cyan-800');
            }
        }

        document.getElementById('search-input').addEventListener('input', (e) => {
            world.ringsData([]);
            const query = e.target.value.toLowerCase();
            const filtered = globalCablesData.filter(c => 
                c.name.toLowerCase().includes(query) || 
                (c.owners && c.owners.toLowerCase().includes(query)) ||
                (c.id && c.id.toLowerCase().includes(query))
            );
            world.pathsData(filtered);
            generatePhotonsForCables(filtered);
        });

        window.onload = initGlobe;
    </script>
</body>
</html>
