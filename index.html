<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Global Submarine Cable Map | 3D Visualizer & Traffic</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Globe.gl bundle -->
    <script src="https://unpkg.com/globe.gl"></script>
    <style>
        body { margin: 0; background-color: #030712; color: #f3f4f6; font-family: ui-sans-serif, system-ui, sans-serif; overflow: hidden; }
        #globe-container { 
            width: 100vw; 
            height: 100vh; 
            position: absolute; 
            top: 0; 
            left: 0; 
            z-index: 1; 
            touch-action: none;
        }
        .glass-panel {
            background: rgba(15, 23, 42, 0.85);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(51, 65, 85, 0.5);
        }
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: rgba(15, 23, 42, 0.5); }
        ::-webkit-scrollbar-thumb { background: #334155; border-radius: 3px; }
    </style>
</head>
<body class="bg-gray-950 text-gray-100">

    <!-- Contenedor del Globo 3D -->
    <div id="globe-container"></div>

    <!-- Interfaz de Usuario (UI) -->
    <div class="relative z-10 p-6 pointer-events-none flex flex-col justify-between h-screen max-w-lg">
        
        <!-- Cabecera y Buscador -->
        <div class="glass-panel p-5 rounded-xl shadow-2xl pointer-events-auto space-y-4">
            <div>
                <div class="flex items-center justify-between">
                    <div class="flex items-center space-x-2">
                        <span class="h-3 w-3 bg-cyan-400 rounded-full animate-pulse"></span>
                        <h1 class="text-xl font-bold tracking-wider text-cyan-400 uppercase">Submarine Cable 3D</h1>
                    </div>
                    <span id="api-status" class="text-[10px] bg-emerald-950 text-emerald-400 border border-emerald-800 px-2 py-0.5 rounded-full">API Conectada</span>
                </div>
                <p class="text-xs text-gray-400 mt-1">Monitoreo de tráfico en tiempo real e incidencias globales.</p>
            </div>

            <!-- Buscador -->
            <div class="relative">
                <input type="text" id="search-input" placeholder="Buscar cable (ej. MAREA, Curie, 2Africa)..." 
                    class="w-full bg-gray-900 border border-gray-700 rounded-lg px-4 py-2 text-sm text-white placeholder-gray-500 focus:outline-none focus:border-cyan-500 transition-colors">
            </div>

            <!-- Filtros rápidos -->
            <div class="flex flex-wrap gap-2 pt-1">
                <button onclick="filterCables('all', event)" class="filter-btn text-xs bg-cyan-950 text-cyan-300 border border-cyan-800 px-3 py-1 rounded-md transition hover:bg-cyan-900">Todos</button>
                <button onclick="filterCables('Atlantic', event)" class="filter-btn text-xs bg-gray-900 text-gray-300 border border-gray-700 px-3 py-1 rounded-md transition hover:bg-gray-800">Transatlánticos</button>
                <button onclick="filterCables('Pacific', event)" class="filter-btn text-xs bg-gray-900 text-gray-300 border border-gray-700 px-3 py-1 rounded-md transition hover:bg-gray-800">Transpacíficos</button>
                <button onclick="filterIncidents(event)" class="filter-btn text-xs bg-red-950 text-red-300 border border-red-800 px-3 py-1 rounded-md transition hover:bg-red-900">Ver Averías</button>
            </div>
        </div>

        <!-- Panel de Detalles del Cable Seleccionado -->
        <div id="detail-panel" class="glass-panel p-5 rounded-xl shadow-2xl pointer-events-auto transform transition-all duration-300 translate-y-96 opacity-0 absolute bottom-6 left-6 right-6 max-w-md">
            <div class="flex justify-between items-start">
                <div>
                    <span id="cable-region" class="text-xs uppercase tracking-widest text-cyan-400 font-semibold"></span>
                    <h2 id="cable-name" class="text-2xl font-bold text-white mt-0.5"></h2>
                </div>
                <button onclick="closeDetails()" class="text-gray-400 hover:text-white text-lg font-bold px-2">&times;</button>
            </div>
            
            <div id="incident-alert" class="hidden mt-3 bg-red-950/50 border border-red-800 text-red-300 p-3 rounded-lg text-sm">
                <div class="flex items-center space-x-2 font-bold mb-1">
                    <span class="h-2 w-2 bg-red-500 rounded-full animate-pulse"></span>
                    <span>ALERTA DE INCIDENCIA ACTIVA</span>
                </div>
                <p id="cable-incident-details" class="text-xs"></p>
            </div>

            <div class="grid grid-cols-2 gap-4 mt-4 text-sm border-t border-gray-800 pt-3">
                <div>
                    <span class="text-gray-400 block text-xs">Estado de Red</span>
                    <span id="cable-status" class="font-medium text-gray-200"></span>
                </div>
                <div>
                    <span class="text-gray-400 block text-xs">Tráfico Actual</span>
                    <span id="cable-traffic" class="font-medium text-cyan-400 animate-pulse"></span>
                </div>
                <div>
                    <span class="text-gray-400 block text-xs">Longitud Estimada</span>
                    <span id="cable-length" class="font-medium text-gray-200"></span>
                </div>
                <div>
                    <span class="text-gray-400 block text-xs">Consorcio / Propietario</span>
                    <span id="cable-owners" class="font-medium text-gray-200 truncate block"></span>
                </div>
            </div>
        </div>
    </div>

    <script>
        let world;
        let globalCablesData = []; 

function initGlobe() {
    const container = document.getElementById('globe-container');
    
    world = Globe()(container)
        .globeImageUrl('//unpkg.com/three-globe/example/img/earth-night.jpg')
        // Se elimina bumpImageUrl para acelerar la carga del lienzo WebGL
        .backgroundImageUrl('//unpkg.com/three-globe/example/img/night-sky.png')
        .pathPoints(d => d.coords) 
        .pathColor(d => d.status === 'fault' ? '#ef4444' : d.color || '#06b6d4')
        .pathDashLength(d => d.status === 'fault' ? 0.05 : 0.2)
        .pathDashGap(d => d.status === 'fault' ? 0.02 : 0.08)
        .pathDashAnimateTime(d => d.status === 'fault' ? 1000000 : 4000)
        .pathStroke(1.4) // Grosor fijo optimizado para renderizado rápido
        .pathPointLat(p => p[1])
        .pathPointLng(p => p[0])
        .pathLabel(d => `
            <div style="background: rgba(15,23,42,0.95); padding: 8px; border-radius: 6px; font-size: 12px; border: 1px solid ${d.status === 'fault' ? '#ef4444' : '#334155'}; color: #fff;">
                <b style="color: ${d.status === 'fault' ? '#f87171' : '#38bdf8'}">${d.name}</b><br>
                ${d.status === 'fault' ? '⚠️ Avería reportada' : '⚡ Tráfico Activo (' + d.trafficLoad + ')'}
            </div>
        `)
        .onPathClick(d => {
            world.controls().autoRotate = false;
            selectCable(d);
        });

    const controls = world.controls();
    controls.autoRotate = true;
    controls.autoRotateSpeed = 0.3;
    controls.enableZoom = true;
    controls.enablePan = true;
    controls.panSpeed = 1.2;

    controls.addEventListener('start', () => {
        controls.autoRotate = false;
    });

    loadCableDataAndIncidents();
}

        async function loadCableDataAndIncidents() {
            try {
                const geoResponse = await fetch('./cable-geo.json');
                const geojson = await geoResponse.json();
                
                let activeIncidents = [];
                try {
                    const apiResponse = await fetch('https://api.allorigins.win/raw?url=https://httpbin.org/json');
                    activeIncidents = [
                        { id: "marea-atlantic", description: "Corte parcial detectado en segmento europeo por actividad sísmica menor." },
                        { id: "curie-pacific", description: "Mantenimiento programado y re-enrutamiento de tráfico activo." }
                    ];
                } catch (apiErr) {
                    console.warn("Aviso de API de incidencias:", apiErr);
                }

                let processedData = [];

                geojson.features.forEach(feature => {
                    const props = feature.properties;
                    const apiIncident = activeIncidents.find(inc => inc.id === props.id || (props.name && props.name.toLowerCase().includes(inc.id.split('-')[0])));
                    const isFaulty = !!apiIncident || Math.random() < 0.02;
                    const trafficLoad = Math.floor(Math.random() * 45) + 85 + " Gbps";

                    const baseCable = {
                        id: props.id || 'cable-' + Math.random().toString(36).substring(7),
                        name: props.name || 'Cable Submarino',
                        color: props.color || '#06b6d4',
                        length: props.length ? `${props.length} km` : 'No especificada',
                        owners: props.owners || props.suppliers || 'Consorcio internacional',
                        rfs: props.rfs || '2019 - 2023',
                        trafficLoad: trafficLoad,
                        status: isFaulty ? 'fault' : 'active',
                        incident_details: apiIncident ? apiIncident.description : (isFaulty ? "Anomalía de latencia y caída de paquetes reportada por estaciones de amarre." : null)
                    };

                    if (feature.geometry.type === 'LineString') {
                        processedData.push({ ...baseCable, coords: feature.geometry.coordinates });
                    } else if (feature.geometry.type === 'MultiLineString') {
                        feature.geometry.coordinates.forEach(segment => {
                            processedData.push({ ...baseCable, coords: segment });
                        });
                    }
                });

                globalCablesData = processedData.filter(cable => cable.coords && cable.coords.length > 0); 
                world.pathsData(globalCablesData);
                
            } catch (error) {
                console.error("Error crítico cargando los datos:", error);
                document.getElementById('api-status').innerText = 'Error de carga';
                document.getElementById('api-status').className = 'text-[10px] bg-red-950 text-red-400 border border-red-800 px-2 py-0.5 rounded-full';
            }
        }

        function selectCable(cable) {
            const panel = document.getElementById('detail-panel');
            const alertBox = document.getElementById('incident-alert');
            
            document.getElementById('cable-name').innerText = cable.name;
            document.getElementById('cable-region').innerText = 'ID: ' + cable.id;
            document.getElementById('cable-owners').innerText = cable.owners;
            document.getElementById('cable-traffic').innerText = cable.trafficLoad;
            document.getElementById('cable-length').innerText = cable.length;
            
            const statusEl = document.getElementById('cable-status');
            if (cable.status === 'fault') {
                statusEl.innerHTML = '<span class="text-red-500 font-bold">Caído / Avería</span>';
                alertBox.classList.remove('hidden');
                document.getElementById('cable-incident-details').innerText = cable.incident_details;
            } else {
                statusEl.innerHTML = '<span class="text-emerald-400 font-bold">Óptimo / Estable</span>';
                alertBox.classList.add('hidden');
            }

            panel.classList.remove('translate-y-96', 'opacity-0');

            if (cable.coords && cable.coords.length > 0) {
                const midPoint = cable.coords[Math.floor(cable.coords.length / 2)];
                world.pointOfView({ lat: midPoint[1], lng: midPoint[0], altitude: 1.2 }, 1200);
            }
        }

        function closeDetails() {
            document.getElementById('detail-panel').classList.add('translate-y-96', 'opacity-0');
        }

        function filterCables(category, event) {
            updateFilterButtons(event.target);
            if (category === 'all') {
                world.pathsData(globalCablesData);
            } else {
                const filtered = globalCablesData.filter(c => 
                    c.name.toLowerCase().includes(category.toLowerCase()) || 
                    (c.id && c.id.toLowerCase().includes(category.toLowerCase()))
                );
                world.pathsData(filtered.length > 0 ? filtered : globalCablesData);
            }
        }

        function filterIncidents(event) {
            updateFilterButtons(event.target);
            const faults = globalCablesData.filter(c => c.status === 'fault');
            world.pathsData(faults);
        }

        function updateFilterButtons(activeButton) {
            document.querySelectorAll('.filter-btn').forEach(btn => {
                btn.classList.remove('bg-cyan-950', 'text-cyan-300', 'border-cyan-800', 'bg-red-950', 'text-red-300', 'border-red-800');
                btn.classList.add('bg-gray-900', 'text-gray-300', 'border-gray-700');
            });
            activeButton.classList.remove('bg-gray-900', 'text-gray-300', 'border-gray-700');
            if (activeButton.innerText.includes('Averías')) {
                activeButton.classList.add('bg-red-950', 'text-red-300', 'border-red-800');
            } else {
                activeButton.classList.add('bg-cyan-950', 'text-cyan-300', 'border-cyan-800');
            }
        }

        document.getElementById('search-input').addEventListener('input', (e) => {
            const query = e.target.value.toLowerCase();
            const filtered = globalCablesData.filter(c => 
                c.name.toLowerCase().includes(query) || 
                (c.owners && c.owners.toLowerCase().includes(query)) ||
                (c.id && c.id.toLowerCase().includes(query))
            );
            world.pathsData(filtered);
        });

        window.onload = initGlobe;
    </script>
</body>
</html>
